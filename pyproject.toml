[tool.poetry]
name = "EmsiApiPy"
version = "0.0.1"
description = "Package for connecting to the Emsi APIs"
authors = ["Caleb Courtney"]
readme = "README.md"
license = "GPL-3.0-only"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
requests = "2.32.4"
pandas = "^2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79
